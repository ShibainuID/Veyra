[project]
name = "veyra-ml"
version = "0.1.0"
description = "Training and evaluation for Veyra's cattle muzzle identification and weight estimation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pillow>=10.4",
    "tqdm>=4.66",
    "tabulate>=0.9",
    "openpyxl>=3.1",
    "opencv-contrib-python-headless>=4.10",
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]
