[project]
name = "veyra-api"
version = "0.1.0"
description = "Veyra API service: records, jobs, audit, perception adapters, and background workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Heavy model dependencies, needed only by the enrollment worker and perception adapters.
perception = [
    "numpy>=2.0",
    "opencv-contrib-python-headless>=4.10",
    "onnxruntime>=1.20",
    "pillow>=10.4",
    "torch>=2.5",
    "ultralytics>=8.3",
    "open_clip_torch>=2.26",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
